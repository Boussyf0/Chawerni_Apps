# Build de l'APK Android (app mobile Flutter) → artefact téléchargeable + release.
name: build-apk

on:
  push:
    tags: ["v*"]            # ex. v1.0.0 → publie une release avec l'APK
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chawerni_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.6"

      - run: flutter pub get
      # L'URL de l'API est injectée à la compilation (--dart-define).
      - run: flutter build apk --release --dart-define=CHAWERNI_API_BASE=https://${{ vars.API_DOMAIN }}

      - uses: actions/upload-artifact@v4
        with:
          name: chawerni-release-apk
          path: chawerni_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chawerni_app/build/app/outputs/flutter-apk/app-release.apk
