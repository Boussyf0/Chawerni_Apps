# Auto-deploy de l'API sur le droplet DigitalOcean à chaque push sur main.
# Le droplet rebuild lui-même (couches Docker en cache → quasi instantané), donc
# pas besoin de builder l'image dans GitHub Actions. On se contente d'un SSH qui
# tire le code (clé de déploiement read-only déjà configurée) et relance l'API.
#
# Secrets requis (repo → Settings → Secrets and variables → Actions) :
#   DROPLET_HOST     = 164.90.216.143
#   DROPLET_USER     = root
#   DROPLET_SSH_KEY  = clé PRIVÉE gha_deploy (générée sur le droplet)
name: deploy-api

on:
  push:
    branches: [main]
    # Ne se déclenche que si le backend change (pas pour un commit app-only).
    paths: ["backend/**", "rag/**", "Dockerfile", "docker-compose.yml", "Caddyfile"]
  workflow_dispatch: {}   # bouton « Run workflow » manuel

concurrency:
  group: deploy-api       # un seul déploiement à la fois
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on droplet over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/chawerni
            git pull --ff-only
            docker compose up -d --build api
            docker image prune -f
