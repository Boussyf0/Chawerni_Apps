# Build de l'image API et déploiement sur le droplet DigitalOcean via SSH.
# Secrets requis (repo → Settings → Secrets) :
#   DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY
# L'image est publiée sur GHCR (ghcr.io/<owner>/chawerni-api).
name: deploy-api

on:
  push:
    branches: [main]
    paths: ["backend/**", "rag/**", "Dockerfile", "docker-compose.yml", "Caddyfile"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chawerni-api:latest

      - name: Deploy on droplet over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/chawerni
            docker compose pull api || true
            docker compose up -d --build
            docker image prune -f
